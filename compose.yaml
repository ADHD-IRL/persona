services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: agentdebate
      POSTGRES_USER: agentdebate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdebate -d agentdebate"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://agentdebate:${POSTGRES_PASSWORD}@db:5432/agentdebate
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      MITRE_AIP_BASE_URL: ${MITRE_AIP_BASE_URL:-https://models.k8s.aip.mitre.org/v1}
      MITRE_AIP_API_KEY: ${MITRE_AIP_API_KEY:-}
      MITRE_AIP_MODEL: ${MITRE_AIP_MODEL:-}
      MITRE_AIP_SUPPORTS_TOOLS: ${MITRE_AIP_SUPPORTS_TOOLS:-false}
      MITRE_AIP_TOKEN_LIMIT_FIELD: ${MITRE_AIP_TOKEN_LIMIT_FIELD:-max_tokens}
      MITRE_AIP_STREAM_USAGE: ${MITRE_AIP_STREAM_USAGE:-true}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MCP_WORKSPACE_ID: ${MCP_WORKSPACE_ID:-}
      MCP_API_KEYS: ${MCP_API_KEYS:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    init: true
volumes:
  postgres_data:
